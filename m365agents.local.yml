# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
# Visit https://aka.ms/teamsfx-v5.0-guide for details on this file
# Visit https://aka.ms/teamsfx-actions for details on actions
version: v1.11

provision:
  # Creates an app
  - uses: teamsApp/create
    with:
      # app name
      name: CompanyIQ${{APP_NAME_SUFFIX}}
    # Write the information of created resources into environment file for
    # the specified environment variable(s).
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Create or reuse an existing Microsoft Entra application for bot.
  - uses: aadApp/create
    with:
      # The Microsoft Entra application's display name
      name: CompanyIQ${{APP_NAME_SUFFIX}}
      generateClientSecret: true
      generateServicePrincipal: true
      signInAudience: AzureADMultipleOrgs
    writeToEnvironmentFile:
      # The Microsoft Entra application's client id created for bot.
      clientId: BOT_ID
      # The Microsoft Entra application's client secret created for bot.
      clientSecret: SECRET_BOT_PASSWORD
      # The Microsoft Entra application's object id created for bot.
      objectId: BOT_OBJECT_ID

  # SSO uses SSO_APP_ID (env/.env.local) — the CompanyIQ Entra app, which
  # also doubles as this bot's channel credential locally. The toolkit
  # manages no separate SSO app registration.

  # The local bot was migrated from dev.botframework.com to an Azure Bot
  # resource (SingleTenant). Update its messaging endpoint to the current
  # dev tunnel on every provision. Requires an az login on this machine and
  # AZURE_SUBSCRIPTION_ID/AZURE_RESOURCE_GROUP_NAME set in env/.env.local.
  - uses: script
    with:
      run: az resource update --subscription ${{AZURE_SUBSCRIPTION_ID}} --resource-group ${{AZURE_RESOURCE_GROUP_NAME}} --resource-type Microsoft.BotService/botServices --name ${{BOT_ID}} --set properties.endpoint=${{BOT_ENDPOINT}}/api/messages


  # Build app package with latest env value
  - uses: teamsApp/zipAppPackage
    with:
      # Path to manifest template
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  # Validate app package using validation rules
  - uses: teamsApp/validateAppPackage
    with:
      # Relative path to this file. This is the path for built zip file.
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Apply the app manifest to an existing app in
  # Developer Portal.
  # Will use the app id in manifest file to determine which app to update.
  - uses: teamsApp/update
    with:
      # Relative path to this file. This is the path for built zip file.
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip


deploy:
  # Run npm command
  - uses: cli/runNpmCommand
    name: install dependencies
    with:
      args: install

  # Generate runtime environment variables
  - uses: file/createOrUpdateEnvironmentFile
    with:
      target: ./.localConfigs
      envs:
        CLIENT_ID: ${{BOT_ID}}
        CLIENT_SECRET: ${{SECRET_BOT_PASSWORD}}
        TENANT_ID: ${{TEAMS_APP_TENANT_ID}}
        BOT_TYPE: SingleTenant
        AZURE_OPENAI_API_KEY: ${{AZURE_OPENAI_API_KEY}}
        AZURE_OPENAI_ENDPOINT: ${{AZURE_OPENAI_ENDPOINT}}
        AZURE_OPENAI_API_VERSION: ${{AZURE_OPENAI_API_VERSION}}
        AZURE_OPENAI_CHAT_DEPLOYMENT: ${{AZURE_OPENAI_CHAT_DEPLOYMENT}}
        AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{AZURE_OPENAI_EMBEDDING_DEPLOYMENT}}
        AZURE_SEARCH_QUERY_KEY: ${{AZURE_SEARCH_QUERY_KEY}}
        AZURE_SEARCH_ADMIN_KEY: ${{AZURE_SEARCH_ADMIN_KEY}}
        AZURE_SEARCH_ENDPOINT: ${{AZURE_SEARCH_ENDPOINT}}
        AZURE_SEARCH_INDEX_NAME: ${{AZURE_SEARCH_INDEX_NAME}}
        AZURE_SQL_SERVER: ${{AZURE_SQL_SERVER}}
        AZURE_SQL_DATABASE: ${{AZURE_SQL_DATABASE}}
        AZURE_SQL_USERNAME: ${{AZURE_SQL_USERNAME}}
        AZURE_SQL_PASSWORD: ${{AZURE_SQL_PASSWORD}}
        DEV_USER_SCOPE: ${{DEV_USER_SCOPE}}
        DB_KEEPALIVE: ${{DB_KEEPALIVE}}
        OAUTH_CONNECTION_NAME: ${{OAUTH_CONNECTION_NAME}}
        USER_SCOPE_MAP: ${{USER_SCOPE_MAP}}
        SHAREPOINT_SITES: ${{SHAREPOINT_SITES}}
        CONNECTOR_PUBLIC_WEB_ENABLED: ${{CONNECTOR_PUBLIC_WEB_ENABLED}}
        ORG_WEBSITE_ALLOWLIST: ${{ORG_WEBSITE_ALLOWLIST}}
        MCP_SERVERS: ${{MCP_SERVERS}}
        FOUNDRY_AGENTS: ${{FOUNDRY_AGENTS}}
        HTTP_AGENTS: ${{HTTP_AGENTS}}
        FABRIC_DATA_AGENTS: ${{FABRIC_DATA_AGENTS}}
        ACTIONS_FLOWS_ENABLED: ${{ACTIONS_FLOWS_ENABLED}}
        FLOWS: ${{FLOWS}}